get:
  summary: Get a kubernetes namespace by name
  description: |
    Get a kubernetes namespace by name
  tags:
    - clusters
  operationId: GetNamespace
  parameters:
    - in: path
      name: clusterId
      schema:
        type: string
      required: true
      description: Cluster ID
    - in: path
      name: namespace
      schema:
        type: string
      required: true
      description: Kubernetes namespace
  responses:
    '200':
      description: Namespace information
      content:
        application/json:
          schema:
            $ref: '../../definition/Namespace.yaml'
    default:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../../definition/ServerResponse.yaml'

delete:
  summary: Delete k8s namespace by name
  description: |
    Delete k8s namespace by name
  tags:
    - clusters
  operationId: DeleteNamespace
  parameters:
    - in: path
      name: clusterId
      schema:
        type: string
      required: true
      description: Cluster ID
    - in: path
      name: namespace
      schema:
        type: string
      required: true
      description: Kubernetes namespace
  responses:
    '200':
      description: k8s namespace deleted successfully
      content:
        application/json:
          schema:
            $ref: '../../definition/ServerResponse.yaml'
    default:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../../definition/ServerResponse.yaml'
