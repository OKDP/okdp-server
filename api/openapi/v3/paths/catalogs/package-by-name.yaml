get:
  summary: Get package by catalog id and package name
  description: |
    Returns a single package, identified by its name, from the given catalog.
  tags:
    - catalogs
  operationId: GetPackage
  parameters:
    - in: path
      name: catalogId
      schema:
        type: string
      required: true
      description: Catalog ID
    - in: path
      name: name
      schema:
        type: string
      required: true
      description: Package name
  responses:
    '200':
      description: Package information
      content:
        application/json:
          schema:
            $ref: '../../definition/Package.yaml'
    default:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '../../definition/ServerResponse.yaml'

