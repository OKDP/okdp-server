type: object
xml:
  name: Catalog
required:
- "id"
- "name"
- "description"
- "repoUrl"
- "packages"
properties:
  id:
    type: string
    x-go-name: ID
  name:
    type: string
  description:
    type: string
  repoUrl:
    type: string
    format: uri
    x-go-name: repoURL
  credentials:
    type: object
    properties:
      robotAccountName:
        type: string
      robotAccountToken:
        type: string
      dockerconfigjson:
        type: string
  packages:
    type: array
    items:
      type: object
      required:
      - name
      properties:
        name:
          type: string

